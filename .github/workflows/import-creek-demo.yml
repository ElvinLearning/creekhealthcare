name: Import standalone Creek Health demo

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-creek-demo.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: creek-health-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy the verified demo to this repository root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kaysongt/cozydigital-site/git/blobs/7636bc571e34622c77aae501f61dbd26381030eb > /tmp/creek-source-blob.json
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          blob = json.loads(Path('/tmp/creek-source-blob.json').read_text())
          assert blob['sha'] == '7636bc571e34622c77aae501f61dbd26381030eb'
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha256(data).hexdigest() == 'bdc454c492435970d2eebeb428c1b12d242882e4ac911617ce22f52d9fa80ce7'
          assert len(data) == 55349
          destination = Path('index.html')
          if destination.exists() and destination.read_bytes() != data:
              raise SystemExit('Refusing to overwrite a different existing index.html')
          destination.write_bytes(data)
          Path('.nojekyll').touch()
          print('Verified: root index.html is byte-for-byte identical to the approved demo.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Add standalone Creek Health site at repository root"
            git push origin HEAD:main
          fi
          printf '\n## Standalone demo imported\n\n`index.html` is at the repository root. The existing Cozy Digital demo was not modified.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect current GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/creek-pages.json 2>/tmp/creek-pages-error.txt; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/creek-pages.json').read_text())
          print(json.dumps({k:p.get(k) for k in ['html_url','status','build_type','source','public','https_enforced']},indent=2))
          PY
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            cat /tmp/creek-pages-error.txt
          fi
      - name: Try enabling GitHub Pages
        if: steps.pages.outputs.enabled == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f 'build_type=legacy' -f 'source[branch]=main' -f 'source[path]=/' --jq '{html_url,status,source,public}'
      - name: Report Pages status after the attempt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,status,build_type,source,public,https_enforced}'; then
            printf '\nGitHub Pages is configured.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nGitHub Pages is not enabled yet. In repository Settings > Pages, select Deploy from a branch, main, / (root), then Save.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
